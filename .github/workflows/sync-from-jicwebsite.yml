name: Sync latest JIC website
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sync-from-jicwebsite.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Clone source
        run: git clone --depth 1 https://github.com/jicuser/website.git /tmp/jic-source
      - name: Replace with source
        run: rsync -a --delete --exclude='.git' /tmp/jic-source/ ./
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Already in sync"
          else
            git commit -m "Sync latest JIC structure and admin access"
            git push origin main
          fi
