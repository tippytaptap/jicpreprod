name: Sync latest production website

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-production.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Vercel repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone latest production website
        run: git clone --depth 1 https://github.com/jicuser/website.git /tmp/jicwebsite

      - name: Replace Vercel repo with production contents
        run: |
          rsync -a --delete --exclude='.git' /tmp/jicwebsite/ ./

      - name: Commit exact production copy
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Vercel repo already matches production.'
            exit 0
          fi
          git commit -m 'Sync latest JIC production website'
          git push origin HEAD:main
